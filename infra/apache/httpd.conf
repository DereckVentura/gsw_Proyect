ServerRoot "/usr/local/apache2"
Listen 8080
Listen 8443
ServerName localhost
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule alias_module modules/mod_alias.so
User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogFormat "%h %t \"%r\" %>s %b" compact
CustomLog /proc/self/fd/1 compact
TypesConfig conf/mime.types
DirectoryIndex index.html
ServerTokens Prod
ServerSignature Off
ProxyRequests Off
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)
<VirtualHost *:8080>
  Redirect permanent / https://localhost:8443/
</VirtualHost>
<VirtualHost *:8443>
  SSLEngine On
  SSLProtocol -all +TLSv1.2 +TLSv1.3
  SSLCertificateFile /certs/localhost.crt
  SSLCertificateKeyFile /certs/localhost.key
  DocumentRoot /usr/local/apache2/htdocs
  <Directory /usr/local/apache2/htdocs>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /index.html
  </Directory>
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass /api/ http://api:3000/api/ connectiontimeout=3 timeout=30
  ProxyPassReverse /api/ http://api:3000/api/
  ProxyPass /health http://api:3000/health connectiontimeout=3 timeout=10
  ProxyPassReverse /health http://api:3000/health
  ProxyPass /media/ http://api:3000/media/ connectiontimeout=3 timeout=30
  ProxyPassReverse /media/ http://api:3000/media/
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
