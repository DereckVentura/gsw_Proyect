events { worker_connections 1024; }
http {
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream autorent {
    zone autorent 64k;
    server nodo1:3000 resolve max_fails=1 fail_timeout=5s;
    server nodo2:3000 resolve max_fails=1 fail_timeout=5s;
    server nodo3:3000 resolve max_fails=1 fail_timeout=5s;
  }
  log_format cluster '$time_iso8601 "$request" status=$status upstream=$upstream_addr';
  access_log /dev/stdout cluster;
  error_log /dev/stderr warn;
  server {
    listen 8443 ssl;
    server_name localhost nginx;
    ssl_certificate /certs/localhost.crt;
    ssl_certificate_key /certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    location / {
      proxy_pass http://autorent;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      # Sin non_idempotent: no repetir POST ya enviados a otra instancia.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
  }
}
