name: autorent-gsw
x-api: &api
  image: autorent-gsw-api:local
  build: .
  restart: unless-stopped
  depends_on:
    inicializar: {condition: service_completed_successfully}
  environment: &api-env
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DB_HOST: mysql
    DB_PORT: 3306
    DB_NAME: autorent_gsw
    DB_USER: autorent_app
    DB_PASSWORD: ${DB_PASSWORD:?Ejecuta preparar-laboratorio.ps1}
    JWT_SECRET: ${JWT_SECRET:?Ejecuta preparar-laboratorio.ps1}
    DB_SSL: 'false'
    DB_POOL_SIZE: 5
    CORS_ORIGINS: https://localhost:8443
    TRUST_PROXY_HOPS: 2
    ENABLE_FAILURE_SIMULATION: 'true'
  networks: [clusternet, diagnostico]
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health/database').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 4s
    retries: 3
    start_period: 20s
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: autorent_gsw
      MYSQL_USER: autorent_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta preparar-laboratorio.ps1}
    volumes: [mysql_gsw:/var/lib/mysql]
    networks: [clusternet]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  inicializar:
    image: autorent-gsw-api:local
    build: .
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      <<: *api-env
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: [node, scripts/inicializar-gsw.mjs]
    networks: [clusternet]
  nodo1:
    <<: *api
    hostname: nodo1
    ports: ['127.0.0.1:19001:3000']
    environment: {<<: *api-env, NODE_ID: nodo1}
  nodo2:
    <<: *api
    hostname: nodo2
    ports: ['127.0.0.1:19002:3000']
    environment: {<<: *api-env, NODE_ID: nodo2}
  nodo3:
    <<: *api
    hostname: nodo3
    ports: ['127.0.0.1:19003:3000']
    environment: {<<: *api-env, NODE_ID: nodo3}
  nginx:
    image: nginx:stable-alpine
    depends_on:
      nodo1: {condition: service_healthy}
      nodo2: {condition: service_healthy}
      nodo3: {condition: service_healthy}
    ports: ['127.0.0.1:8444:8443']
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.local/certs:/certs:ro
    networks: [frontend, clusternet]
    restart: unless-stopped
  apache:
    build: {context: ., dockerfile: infra/apache/Dockerfile}
    depends_on: [nginx]
    ports: ['127.0.0.1:8443:8443', '127.0.0.1:8088:8080']
    volumes: ['./.local/certs:/certs:ro']
    networks: [frontend]
    restart: unless-stopped
networks:
  frontend:
  diagnostico:
  clusternet: {internal: true}
volumes:
  mysql_gsw:
